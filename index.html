<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07101f">
<link rel="manifest" href="manifest.json">
<title>Keuangan Harian</title>

<style>
:root{
 --bg:#050705; --panel:#0d100c; --panel2:#12160f; --ink:#f7f9ef; --muted:#9aa08c;
 --lime:#b9ff3b; --lime2:#8fdb25; --green:#b9ff3b; --red:#ff6572; --blue:#78a6ff;
 --yellow:#ffd84d; --line:#1c4037; --nav:#06120f;
 --shadow:0 16px 40px rgba(0,0,0,.42);
}
*{box-sizing:border-box}
html{background:#061713}
body{
 margin:0;background:#061713;color:var(--ink);
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif;
}
button,input,select{font:inherit}
.app{
 width:min(480px,100%);min-height:100vh;margin:auto;padding-bottom:104px;
 background:
 radial-gradient(110% 42% at 50% -4%,rgba(185,255,59,.13),transparent 58%),
 radial-gradient(90% 55% at 0% 55%,rgba(26,95,75,.18),transparent 65%),
 linear-gradient(180deg,#071a16 0%,#061512 48%,#04110e 100%);
}
.top{padding:18px 18px 7px}
.topbar{display:flex;align-items:center;justify-content:space-between}
.profile{display:flex;align-items:center;gap:11px}
.avatar{
 width:43px;height:43px;border-radius:50%;display:grid;place-items:center;
 background:linear-gradient(145deg,#252d1b,#11140e);border:1px solid #3b4824;color:var(--lime);
 font-size:19px;
}
.hello{font-size:15px;font-weight:850}
.sub{font-size:10px;color:var(--muted);margin-top:3px}
.topicons{display:flex;gap:8px}
.round{
 width:39px;height:39px;border:1px solid #303824;border-radius:50%;
 background:rgba(17,45,39,.72);color:#e9eedc;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:17px;
}
.balance{
 margin:12px 15px 0;padding:20px 19px;border-radius:26px;
 background:
 radial-gradient(90% 130% at 100% 0%,rgba(185,255,59,.20),transparent 60%),
 linear-gradient(145deg,rgba(18,54,45,.94),rgba(7,25,21,.94));
 border:1px solid rgba(137,203,174,.18);box-shadow:var(--shadow),0 0 34px rgba(80,190,110,.055);
 backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
}
.balance small{opacity:.72;font-size:9px;letter-spacing:.5px}
.balance h1{font-size:35px;letter-spacing:-1.3px;margin:5px 0 4px}
.balance .change{font-size:10px;color:#bfc8ae}
.section{padding:0 15px;margin-top:18px}
.head{display:flex;justify-content:space-between;align-items:center;margin:0 3px 9px}
.head h2{font-size:14px;margin:0;font-weight:850}
.link{border:0;background:none;color:var(--lime);font-size:10px;font-weight:850}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini{
 background:linear-gradient(145deg,rgba(17,49,42,.82),rgba(7,27,23,.76));border:1px solid rgba(119,171,149,.17);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);
 border-radius:17px;padding:12px;box-shadow:0 10px 25px rgba(0,0,0,.3);min-height:100px;
}
.mini .ico{font-size:18px;color:var(--lime)}
.mini small{display:block;color:var(--muted);font-size:9px;margin-top:9px}
.mini b{display:block;font-size:13px;margin-top:3px}
.green{color:var(--lime)!important}.red{color:var(--red)!important}.blue{color:var(--blue)!important}.yellow{color:var(--yellow)!important}

.card{
 background:linear-gradient(145deg,rgba(15,48,41,.86),rgba(6,25,21,.82));border:1px solid rgba(119,171,149,.17);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
 border-radius:20px;padding:14px;box-shadow:0 12px 30px rgba(0,0,0,.28)
}
.summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.summary div{padding:10px;border-radius:14px;background:rgba(21,55,47,.58);border:1px solid rgba(137,203,174,.13)}
.summary small{display:block;color:var(--muted);font-size:8px}
.summary b{display:block;font-size:12px;margin-top:4px}

.chartbox{height:170px;position:relative;margin-top:4px}
.gridline{position:absolute;left:0;right:0;border-top:1px dashed #252c1e}
.g1{top:20%}.g2{top:50%}.g3{top:80%}
.stepchart{position:absolute;inset:8px 3px 22px;display:flex;align-items:stretch;gap:3px}
.stepcol{flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center}
.step{width:100%;max-width:28px;border-radius:6px 6px 2px 2px;background:linear-gradient(#f3ff63,#b9ff3b)}
.step.net{background:linear-gradient(#efff58,#b6d50f)}
.step.exp{background:linear-gradient(#ff8d97,#ff6572)}
.xlabel{font-size:8px;color:var(--muted);margin-top:5px}
.legend{display:flex;gap:12px;margin-top:5px;font-size:9px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
.dot.blue{background:var(--blue)}.dot.red{background:var(--red)}.dot.green{background:var(--lime)}

/* Premium analytics chart: LittleBee-inspired smooth area/line graph */
.analytics{height:225px;position:relative;overflow:hidden;border-radius:18px;background:radial-gradient(70% 100% at 70% 35%,rgba(185,255,59,.055),transparent 65%)}
.analytics svg{width:100%;height:100%;display:block;overflow:visible}
.chart-grid{stroke:#24483d;stroke-width:1;stroke-dasharray:4 5;opacity:.72}
.chart-axis{fill:#718b80;font-size:8px;font-weight:650}
.area-income{fill:url(#areaIncome)}
.area-expense{fill:url(#areaExpense)}
.area-net{fill:url(#areaNet)}
.line-income{fill:none;stroke:#b9ff3b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;filter:url(#glowGreen)}
.line-expense{fill:none;stroke:#ff6572;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;filter:url(#glowRed)}
.line-net{fill:none;stroke:#78a6ff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;filter:url(#glowBlue)}
.point-income{fill:#b9ff3b;stroke:#11160d;stroke-width:2;filter:url(#glowGreen)}
.point-expense{fill:#ff6572;stroke:#17100f;stroke-width:2;filter:url(#glowRed)}
.point-net{fill:#78a6ff;stroke:#0d1018;stroke-width:2;filter:url(#glowBlue)}
.chart-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:7px;color:#9bb0a5;font-size:9px}
.chart-legend span{display:inline-flex;align-items:center;gap:5px}
.chart-legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chart-legend .lg{background:#b9ff3b;box-shadow:0 0 10px rgba(185,255,59,.55)}
.chart-legend .lr{background:#ff6572;box-shadow:0 0 10px rgba(255,101,114,.45)}
.chart-legend .lb{background:#78a6ff;box-shadow:0 0 10px rgba(120,166,255,.45)}
.chart-tip{position:absolute;right:12px;top:12px;padding:7px 9px;border-radius:11px;background:rgba(10,34,28,.94);border:1px solid #315a4b;box-shadow:0 8px 22px rgba(0,0,0,.35);font-size:8px;color:#aeb6a0}
.chart-tip b{display:block;color:#f3f8e9;font-size:10px;margin-top:2px}


/* LittleBee-inspired glass system */
.heroCard,.mini,.card,.quick button,.txico,.nav,.balance{position:relative;overflow:hidden}
.heroCard::before,.mini::before,.card::before,.quick button::before,.txico::before,.nav::before,.balance::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.055),transparent 32%,rgba(185,255,59,.025) 72%,transparent);pointer-events:none}
.heroCard,.mini,.card,.quick button,.txico{box-shadow:0 14px 34px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.035)}

/* Soft colored shadows across the interface */
.card,.mini,.heroCard,.bigCard,.balance,.quick button,.nav{box-shadow:0 12px 30px rgba(0,0,0,.38),0 0 22px rgba(185,255,59,.035)}
.heroCard:nth-child(1){box-shadow:0 12px 30px rgba(0,0,0,.38),0 0 20px rgba(185,255,59,.08)}
.heroCard:nth-child(2){box-shadow:0 12px 30px rgba(0,0,0,.38),0 0 20px rgba(255,101,114,.07)}
.heroCard:nth-child(3){box-shadow:0 12px 30px rgba(0,0,0,.38),0 0 20px rgba(120,166,255,.08)}
.summary div:nth-child(1){box-shadow:inset 0 0 18px rgba(185,255,59,.035)}
.summary div:nth-child(2){box-shadow:inset 0 0 18px rgba(255,101,114,.035)}
.summary div:nth-child(3){box-shadow:inset 0 0 18px rgba(120,166,255,.04)}
.quick button:hover,.heroCard:hover,.mini:hover{transform:translateY(-1px)}
.quick button,.heroCard,.mini{transition:transform .18s ease,box-shadow .18s ease}

.donutwrap{display:flex;align-items:center;gap:18px}
.donut{
 width:128px;height:128px;border-radius:50%;
 background:conic-gradient(var(--lime) 0 45%,var(--red) 45% 78%,#52665c 78% 100%);
 display:grid;place-items:center;flex:none
}
.donut:after{content:"";width:78px;height:78px;border-radius:50%;background:#10140e}
.donutcenter{position:absolute;text-align:center}
.donutcenter b{display:block;font-size:15px}.donutcenter small{font-size:8px;color:var(--muted)}
.legendlist{font-size:10px;line-height:2.2;color:#b2b9a4}
.legendlist span{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}

.tx{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #20271a}
.tx:last-child{border-bottom:0}
.txico{
 width:39px;height:39px;border-radius:13px;background:rgba(25,62,52,.52);border:1px solid rgba(137,203,174,.15);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
 display:grid;place-items:center;color:var(--lime);font-size:17px
}
.txmain{flex:1}.txmain b{font-size:12px}.txmain small{display:block;color:var(--muted);font-size:9px;margin-top:2px}
.amount{font-size:12px;font-weight:850}

.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{
 border:1px solid rgba(137,203,174,.16);background:rgba(15,47,40,.62);border-radius:16px;padding:11px 4px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
 font-size:9px;color:#cbd2bc;box-shadow:0 8px 22px rgba(0,0,0,.22)
}
.quick i{
 width:32px;height:32px;border-radius:50%;display:grid;place-items:center;margin:0 auto 6px;
 font-style:normal;font-size:16px;background:#18200f;color:var(--lime);border:1px solid #3a4820
}

.nav{
 position:fixed;bottom:10px;left:50%;transform:translateX(-50%);
 width:min(450px,calc(100% - 26px));height:66px;background:rgba(5,20,16,.88);
 border:1px solid rgba(137,203,174,.18);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:30px;display:flex;
 box-shadow:0 15px 38px rgba(0,0,0,.58);z-index:20
}
.nav button{flex:1;border:0;background:none;color:#777e70;font-size:9px;font-weight:800}
.nav button span{display:block;font-size:18px;margin-bottom:2px}
.nav button.active{color:var(--lime)}
.nav button.active span{
 background:rgba(185,255,59,.13);color:var(--lime);padding:4px 12px;border-radius:18px;width:max-content;margin:auto;box-shadow:0 0 20px rgba(185,255,59,.12)
}
.fab{
 position:fixed;right:max(24px,calc((100vw - 480px)/2 + 20px));bottom:88px;
 width:53px;height:53px;border:1px solid #eaff6a;border-radius:50%;
 background:var(--lime);color:#07130f;font-size:25px;box-shadow:0 10px 28px rgba(185,255,59,.24),0 0 24px rgba(185,255,59,.12);z-index:19
}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:end;z-index:40}
.sheet{
 width:min(480px,100%);margin:auto;background:#0b0e09;border:1px solid #2d371f;
 border-bottom:0;border-radius:24px 24px 0 0;padding:18px 18px 28px;max-height:90vh;overflow:auto;color:#fff
}
.handle{width:40px;height:4px;background:#3b4530;border-radius:8px;margin:0 auto 15px}
label{display:block;color:#9ea791;font-size:10px;font-weight:800;margin:11px 0 5px}
input,select{
 width:100%;border:1px solid #303a24;background:#141911;border-radius:13px;padding:13px;
 font-size:15px;color:#fff
}
.save{width:100%;border:0;border-radius:14px;background:var(--lime);color:#101408;padding:14px;font-weight:900;margin-top:15px}
.cancel{width:100%;border:1px solid #303a24;background:#11150f;border-radius:14px;padding:12px;margin-top:8px;color:#c2c9b6;font-weight:800}

.pageTitle{padding:21px 18px 10px;font-size:26px;font-weight:900}
.bigCard{
 margin:0 15px;background:
 radial-gradient(90% 130% at 100% 0%,rgba(185,255,59,.25),transparent 60%),
 linear-gradient(145deg,#12180e,#080a07);
 color:#fff;border:1px solid #3a4622;border-radius:23px;padding:20px;box-shadow:var(--shadow)
}
.bigCard small{opacity:.72;font-size:10px}.bigCard h1{font-size:32px;margin:5px 0}
.assetrow{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #222a19}
.assetrow:last-child{border:0}
.pill{display:inline-block;background:#20290f;color:var(--lime);padding:4px 8px;border-radius:10px;font-size:8px;font-weight:800}
.toast{
 position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#e8ff56;color:#11150b;
 padding:10px 15px;border-radius:18px;font-size:10px;font-weight:900;z-index:100;display:none
}

/* Home: iPhone/Vaulta-like hierarchy */
.heroCards{display:flex;gap:10px;overflow-x:auto;padding:1px 2px 5px;scrollbar-width:none}
.heroCards::-webkit-scrollbar{display:none}
.heroCard{
 min-width:154px;height:112px;padding:13px;border-radius:17px;
 background:linear-gradient(145deg,#161d10,#0c100a);border:1px solid #2f391f;
 box-shadow:0 10px 25px rgba(0,0,0,.28);position:relative;overflow:hidden
}
.heroCard:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;right:-35px;bottom:-45px;background:rgba(185,255,59,.11)}
.heroCard .hcicon{font-size:16px;color:var(--lime);margin-bottom:8px}
.heroCard small{display:block;color:#9bb0a5;font-size:8px}.heroCard b{display:block;font-size:15px;margin-top:4px}
.heroCard span{position:absolute;left:13px;bottom:10px;font-size:8px;color:#737b6c}

.quickTitle{display:flex;align-items:center;justify-content:space-between}
</style>

</head>
<body>
<div id="app" class="app"></div>
<button class="fab" onclick="openModal()">＋</button>
<nav class="nav">
<button id="nh" onclick="render('home')"><span>⌂</span>Beranda</button>
<button id="nt" onclick="render('transactions')"><span>▣</span>Transaksi</button>
<button id="np" onclick="render('portfolio')"><span>◈</span>Portofolio</button>
<button id="nl" onclick="render('pay')"><span>◇</span>Pelunasan</button>
<button id="na" onclick="render('account')"><span>◎</span>Profil</button>
</nav>
<div id="toast" class="toast"></div>
<div id="modal" class="modal" onclick="if(event.target.id==='modal')closeModal()"><div class="sheet">
<div class="handle"></div><h2 style="margin:0">Tambah Transaksi</h2>
<label>Tanggal</label><input id="date" type="date">
<label>Keterangan</label><input id="desc" placeholder="Contoh: makan, gaji, bensin">
<label>Jenis</label><select id="type"><option value="income">Pemasukan</option><option value="expense">Pengeluaran</option><option value="pay">Pelunasan</option></select>
<label>Nominal</label><input id="amount" type="number" inputmode="numeric" placeholder="85000">
<button class="save" onclick="addTx()">Simpan</button><button class="cancel" onclick="closeModal()">Batal</button>
</div></div>
<script>
const $id=(id)=>document.getElementById(id);
const KEY="keuangan_iphone_style_v2";
let d=JSON.parse(localStorage.getItem(KEY)||"null")||{salary:85000,limit:30000,obligation:0,savings:0,tx:[]};
const save=()=>localStorage.setItem(KEY,JSON.stringify(d));
const rp=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(n||0);
const today=()=>new Date().toISOString().slice(0,10);
const fd=s=>new Date(s+"T00:00:00").toLocaleDateString("id-ID",{day:"2-digit",month:"short"});
function totals(){return d.tx.reduce((a,x)=>(a[x.type]=(a[x.type]||0)+x.amount,a),{income:0,expense:0,pay:0})}
function dayExp(){return d.tx.filter(x=>x.date===today()&&x.type==="expense").reduce((a,x)=>a+x.amount,0)}
function recent(){return d.tx.slice().sort((a,b)=>b.id-a.id).slice(0,5).map(x=>`<div class="tx"><div class="txico">${x.type==="income"?"↗":x.type==="pay"?"◇":"↘"}</div><div class="txmain"><b>${x.desc}</b><small>${fd(x.date)} • ${x.type==="income"?"Pemasukan":x.type==="pay"?"Pelunasan":"Pengeluaran"}</small></div><div class="amount ${x.type==="income"?"green":"red"}">${x.type==="income"?"+":"-"}${rp(x.amount)}</div></div>`).join("")}
function nav(p){document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));document.getElementById({home:"nh",transactions:"nt",portfolio:"np",pay:"nl",account:"na"}[p]).classList.add("active")}
function render(p){nav(p);({home,transactions,portfolio,pay,account}[p])()}
function lineChart(days){
 const W=420,H=210,pL=12,pR=12,pT=18,pB=30;
 const vals=days.map(x=>x.value||0),lo=Math.min(...vals,0),hi=Math.max(...vals,1),span=Math.max(hi-lo,1);
 const X=i=>pL+i*((W-pL-pR)/Math.max(days.length-1,1)),Y=v=>pT+(H-pT-pB)*(1-(v-lo)/(hi-lo));
 const pts=days.map((x,i)=>[X(i),Y(x.value||0)]);
 const path=pts.map((p,i)=>{if(!i)return'M'+p[0]+','+p[1];let a=pts[i-1],cx=(a[0]+p[0])/2;return'C'+cx+','+a[1]+' '+cx+','+p[1]+' '+p[0]+','+p[1]}).join(' ');
 const area=path+' L'+pts[pts.length-1][0]+','+(H-pB)+' L'+pts[0][0]+','+(H-pB)+' Z';
 const dots=pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#69f58a"><title>${days[i].full||days[i].l} — ${rp(days[i].value||0)}</title></circle>`).join('');
 const labels=days.map((x,i)=>`<text x="${X(i)}" y="${H-10}" text-anchor="middle" fill="#9aa7a1" font-size="10">${x.date||x.l}</text>`).join('');
 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik portofolio 7 hari">
 <defs>
  <linearGradient id="chartPortfolioArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#69f58a" stop-opacity=".32"/><stop offset="100%" stop-color="#69f58a" stop-opacity="0"/></linearGradient>
  <filter id="chartPortfolioGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 </defs>
 <path d="${area}" fill="url(#chartPortfolioArea)"/>
 <path d="${path}" fill="none" stroke="#69f58a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#chartPortfolioGlow)"/>
 ${dots}${labels}
 </svg>`;
}

function home(){
let t=totals(),e=dayExp(),left=Math.max(0,d.limit-e),m=d.tx.filter(x=>x.date.startsWith(today().slice(0,7))),mi=m.filter(x=>x.type==="income").reduce((a,x)=>a+x.amount,0),me=m.filter(x=>x.type==="expense").reduce((a,x)=>a+x.amount,0),net=mi-me;
let days=[...Array(7)].map((_,i)=>{let z=new Date();z.setHours(0,0,0,0);z.setDate(z.getDate()-(6-i));let s=z.getFullYear()+"-"+String(z.getMonth()+1).padStart(2,"0")+"-"+String(z.getDate()).padStart(2,"0"),value=d.savings+d.tx.filter(x=>x.date<=s).reduce((a,x)=>a+(x.type==="income"?x.amount:-x.amount),0);return{l:String(z.getDate()),date:String(z.getDate()),full:z.toLocaleDateString("id-ID",{weekday:"long",day:"2-digit",month:"long",year:"numeric"}),value:Math.max(0,value)}});
let spentPct=Math.min(100,Math.round((me/Math.max(mi||d.salary,1))*100)), netPct=Math.max(0,100-spentPct);
$id("app").innerHTML=`
<div class="top">
 <div class="topbar">
  <div class="profile"><div class="avatar">₽</div><div><div class="hello">Halo, Kak!</div><div class="sub">Keuangan pribadi • Offline</div></div></div>
  <div class="topicons"><button class="round">⌕</button><button class="round" onclick="render('account')">♧</button></div>
 </div>
</div>

<div class="balance">
 <small>TOTAL SALDO</small>
 <h1>${rp(t.income-t.expense-t.pay)}</h1>
 <div class="change">Gaji harian ${rp(d.salary)} • Batas ${rp(d.limit)} / hari</div>
</div>

<div class="section">
 <div class="head"><h2>Kartu Keuangan</h2><button class="link" onclick="render('portfolio')">Lihat semua ↗</button></div>
 <div class="heroCards">
  <div class="heroCard"><div class="hcicon">＋</div><small>Pemasukan hari ini</small><b>${rp(d.salary)}</b><span>Gaji harian</span></div>
  <div class="heroCard"><div class="hcicon">↘</div><small>Pengeluaran hari ini</small><b>${rp(e)}</b><span>Batas ${rp(d.limit)}</span></div>
  <div class="heroCard"><div class="hcicon">◎</div><small>Sisa boleh dipakai</small><b class="${left?"green":"red"}">${rp(left)}</b><span>${left?"Aman":"Melewati batas"}</span></div>
 </div>
</div>

<div class="section">
 <div class="quickTitle head"><h2>Aksi Cepat</h2><span class="sub">Tambah data</span></div>
 <div class="quick">
  <button onclick="quick('income')"><i>＋</i>Pemasukan</button>
  <button onclick="quick('expense')"><i>↘</i>Pengeluaran</button>
  <button onclick="quick('pay')"><i>⇄</i>Pelunasan</button>
  <button onclick="render('portfolio')"><i>◈</i>Portofolio</button>
  <button onclick="render('transactions')"><i>▤</i>Transaksi</button>
  <button onclick="render('pay')"><i>◇</i>Kewajiban</button>
  <button onclick="render('portfolio')"><i>◌</i>Laporan</button>
  <button onclick="render('account')"><i>⚙</i>Pengaturan</button>
 </div>
</div>

<div class="section">
 <div class="head"><h2>Ringkasan Bulan Ini</h2><span class="sub">${today().slice(0,7)}</span></div>
 <div class="card"><div class="summary">
  <div><small>Pemasukan</small><b class="green">${rp(mi)}</b></div>
  <div><small>Pengeluaran</small><b class="red">${rp(me)}</b></div>
  <div><small>Laba Bersih</small><b class="blue">${rp(net)}</b></div>
 </div></div>
</div>

<div class="section">
 <div class="head"><h2>Penggunaan Bulan Ini</h2><button class="link" onclick="render('transactions')">Detail</button></div>
 <div class="card">
  <div style="display:flex;justify-content:space-between;font-size:10px;margin-bottom:8px"><span>Pengeluaran</span><b>${spentPct}%</b></div>
  <div style="height:8px;border-radius:20px;background:#262d1e;overflow:hidden"><div style="height:100%;width:${spentPct}%;background:var(--lime);border-radius:20px"></div></div>
  <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-top:8px"><span>Terpakai ${rp(me)}</span><span>Sisa ${rp(Math.max(0,mi-me))}</span></div>
 </div>
</div>

<div class="section">
 <div class="head"><h2>Grafik Keuangan 7 Hari</h2><button class="link" onclick="render('portfolio')">Lihat</button></div>
 <div class="card">
  <div class="analytics">
   ${lineChart(days)}
   <div class="chart-tip">7 HARI<b>${rp(days[days.length-1].value||0)} saldo portofolio</b></div>
  </div>
  <div class="chart-legend"><span><i class="lg"></i>Saldo portofolio</span></div>
 </div>
</div>

<div class="section">
 <div class="head"><h2>Diagram Keuangan</h2><button class="link" onclick="render('portfolio')">Detail</button></div>
 <div class="card"><div class="donutwrap"><div style="position:relative"><div class="donut"></div><div class="donutcenter"><b>${rp(Math.max(net,0))}</b><small>laba bersih</small></div></div>
  <div class="legendlist"><div><span style="background:var(--lime)"></span>Pemasukan</div><div><span style="background:var(--red)"></span>Pengeluaran</div><div><span style="background:#52665c"></span>Pelunasan</div></div>
 </div></div>
</div>

<div class="section">
 <div class="head"><h2>Transaksi Terbaru</h2><button class="link" onclick="render('transactions')">Lihat semua ↗</button></div>
 <div class="card">${recent()||'<div style="text-align:center;color:var(--muted);padding:20px;font-size:11px">Belum ada transaksi.</div>'}</div>
</div>`;
}
function transactions(){$id("app").innerHTML=`<div class="pageTitle">Transaksi</div><div class="section"><div class="card"><div class="head"><h2>Semua Transaksi</h2><button class="link" onclick="openModal()">＋ Tambah</button></div>${recentAll()}</div></div>`}
function recentAll(){return d.tx.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).map(x=>`<div class="tx"><div class="txico">${x.type==="income"?"↗":x.type==="pay"?"◇":"↘"}</div><div class="txmain"><b>${x.desc}</b><small>${fd(x.date)} • ${x.type}</small></div><div class="amount ${x.type==="income"?"green":"red"}">${x.type==="income"?"+":"-"}${rp(x.amount)}</div></div>`).join("")||'<div style="text-align:center;color:var(--muted);padding:20px">Belum ada transaksi.</div>'}
function portfolio(){
let t=totals(),cash=Math.max(0,t.income-t.expense-t.pay),total=cash+d.savings;
let days=[...Array(7)].map((_,i)=>{let z=new Date();z.setHours(0,0,0,0);z.setDate(z.getDate()-(6-i));let s=z.getFullYear()+"-"+String(z.getMonth()+1).padStart(2,"0")+"-"+String(z.getDate()).padStart(2,"0"),value=d.savings+d.tx.filter(x=>x.date<=s).reduce((a,x)=>a+(x.type==="income"?x.amount:-x.amount),0);return{date:String(z.getDate()),full:z.toLocaleDateString("id-ID",{weekday:"long",day:"2-digit",month:"long",year:"numeric"}),value:Math.max(0,value)}});
$id("app").innerHTML=`
<div class="section">
<div class="head"><h2>Perkembangan Portofolio</h2><span class="sub">7 hari</span></div>
<div class="card">
<div class="analytics">${lineChart(days)}</div>
<div class="chart-legend"><span><i class="lg"></i>Saldo portofolio</span></div>
</div>
</div>`;
}
function pay(){let t=totals();$id("app").innerHTML=`<div class="pageTitle">Pelunasan</div><div class="section"><div class="cards3"><div class="mini"><small>Sudah dibayar</small><b class="green">${rp(t.pay)}</b></div><div class="mini"><small>Sisa kewajiban</small><b>${rp(d.obligation)}</b></div><div class="mini"><small>Tabungan</small><b>${rp(d.savings)}</b></div></div><div class="card" style="margin-top:10px"><div class="head"><h2>Riwayat Pelunasan</h2><button class="link" onclick="quick('pay')">＋ Bayar</button></div>${d.tx.filter(x=>x.type==="pay").slice().reverse().map(x=>`<div class="assetrow"><span>${x.desc}<small style="display:block;color:var(--muted)">${fd(x.date)}</small></span><b class="red">-${rp(x.amount)}</b></div>`).join("")||'<div style="text-align:center;color:var(--muted);padding:20px">Belum ada pelunasan.</div>'}</div></div>`}
function account(){$id("app").innerHTML=`<div class="pageTitle">Profil & Pengaturan</div><div class="section"><div class="card"><div class="assetrow"><span>Gaji harian</span><b>${rp(d.salary)}</b></div><div class="assetrow"><span>Batas pengeluaran</span><b>${rp(d.limit)}</b></div><div class="assetrow"><span>Tabungan</span><b>${rp(d.savings)}</b></div><div class="assetrow"><span>Kewajiban</span><b>${rp(d.obligation)}</b></div><button class="save" onclick="settingsPrompt()">Ubah Pengaturan</button></div><div class="card"><div class="head"><h2>Data</h2></div><div class="quick"><button onclick="backup()"><i>⬇</i>Backup</button><button onclick="$id("file").click()"><i>⬆</i>Pulihkan</button><button onclick="resetAll()"><i>⌫</i>Hapus</button><button onclick="toast('Data tersimpan di HP')"><i>✓</i>Status</button></div><input id="file" type="file" accept=".json" style="display:none" onchange="restore(this)"></div></div>`}
function settingsPrompt(){let s=prompt("Gaji harian:",d.salary);if(s===null)return;let l=prompt("Batas pengeluaran per hari:",d.limit);if(l===null)return;let sv=prompt("Tabungan saat ini:",d.savings);if(sv===null)return;d.salary=+s||0;d.limit=+l||0;d.savings=+sv||0;save();toast("Pengaturan disimpan");render("home")}
function openModal(){$id("date").value=today();$id("desc").value="";$id("amount").value="";$id("type").value="expense";$id("modal").style.display="flex"}function closeModal(){$id("modal").style.display="none"}function quick(x){openModal();$id("type").value=x}
function addTx(){let a=+$id("amount").value;if(!a){toast("Nominal belum diisi");return}d.tx.push({id:Date.now(),date:$id("date").value||today(),desc:$id("desc").value.trim()||"Transaksi",type:type.value,amount:a});if(type.value==="pay")d.obligation=Math.max(0,d.obligation-a);save();closeModal();toast("Transaksi tersimpan");render("home")}
function backup(){let b=new Blob([JSON.stringify(d,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="backup-keuangan.json";a.click();toast("Backup dibuat")}
function restore(x){let f=x.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let z=JSON.parse(r.result);if(!z.tx)throw 0;d=z;save();toast("Data dipulihkan");render("home")}catch(e){toast("Backup tidak valid")}};r.readAsText(f)}
function resetAll(){if(confirm("Hapus semua data?")){localStorage.removeItem(KEY);location.reload()}}
try{render("home")}catch(err){
  $id("app").innerHTML='<div style="padding:28px;color:#fff;font-family:Arial"><h2>Beranda gagal dimuat</h2><p style="color:#9aa08c">Data tetap aman di HP. Tekan Hapus di Profil untuk mereset data aplikasi.</p><pre style="white-space:pre-wrap;color:#b9ff3b;font-size:11px">'+String(err)+'</pre></div>';
}
</script>
</body>
</html>
