<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07101f">
<link rel="manifest" href="manifest.json">
<title>Keuangan Harian</title>

<style>
:root{
 --bg:#050705; --panel:#0d100c; --panel2:#12160f; --ink:#f7f9ef; --muted:#9aa08c;
 --lime:#b9ff3b; --lime2:#8fdb25; --green:#b9ff3b; --red:#ff6572; --blue:#78a6ff;
 --yellow:#ffd84d; --line:#1c4037; --nav:#06120f;
 --shadow:0 16px 40px rgba(0,0,0,.42);
}
*{box-sizing:border-box}
html{background:#061713}
body{
 margin:0;background:#061713;color:var(--ink);
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif;
}
button,input,select{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
body,input,button,select{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Roboto","Segoe UI",Arial,sans-serif}
.app{
 width:min(480px,100%);min-height:100vh;margin:auto;padding-bottom:104px;
 background:
 radial-gradient(110% 42% at 50% -4%,rgba(185,255,59,.13),transparent 58%),
 radial-gradient(90% 55% at 0% 55%,rgba(26,95,75,.18),transparent 65%),
 linear-gradient(180deg,#071a16 0%,#061512 48%,#04110e 100%);
}
.top{padding:18px 18px 7px}
.topbar{display:flex;align-items:center;justify-content:space-between}
.profile{display:flex;align-items:center;gap:11px}
.avatar{
 width:43px;height:43px;border-radius:50%;display:grid;place-items:center;
 background:linear-gradient(145deg,#252d1b,#11140e);border:1px solid #3b4824;color:var(--lime);
 font-size:19px;
}
.hello{font-size:15px;font-weight:850}
.sub{font-size:10px;color:var(--muted);margin-top:3px}
.topicons{display:flex;gap:8px}
.round{
 width:39px;height:39px;border:1px solid #303824;border-radius:50%;
 background:rgba(17,45,39,.72);color:#e9eedc;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:17px;
}
.balance{
 margin:12px 15px 0;padding:20px 19px;border-radius:26px;
 background:
 radial-gradient(90% 130% at 100% 0%,rgba(185,255,59,.20),transparent 60%),
 linear-gradient(145deg,rgba(18,54,45,.94),rgba(7,25,21,.94));
 border:1px solid rgba(137,203,174,.18);box-shadow:var(--shadow),0 0 34px rgba(80,190,110,.055);
 backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
}
.balance small{opacity:.72;font-size:9px;letter-spacing:.5px}
.balance h1{font-size:35px;letter-spacing:-1.3px;margin:5px 0 4px}
.balance .change{font-size:10px;color:#bfc8ae}
.section{padding:0 15px;margin-top:18px}
.head{display:flex;justify-content:space-between;align-items:center;margin:0 3px 9px}
.head h2{font-size:14px;margin:0;font-weight:850}
.link{border:0;background:none;color:var(--lime);font-size:10px;font-weight:850}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini{
 background:linear-gradient(145deg,rgba(17,49,42,.82),rgba(7,27,23,.76));border:1px solid rgba(119,171,149,.17);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);
 border-radius:17px;padding:12px;box-shadow:0 10px 25px rgba(0,0,0,.3);min-height:100px;
}
.mini .ico{font-size:18px;color:var(--lime)}
.mini small{display:block;color:var(--muted);font-size:9px;margin-top:9px}
.mini b{display:block;font-size:13px;margin-top:3px}
.green{color:var(--lime)!important}.red{color:var(--red)!important}.blue{color:var(--blue)!important}.yellow{color:var(--yellow)!important}

.card{
 background:linear-gradient(145deg,rgba(15,48,41,.86),rgba(6,25,21,.82));border:1px solid rgba(119,171,149,.17);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
 border-radius:20px;padding:14px;box-shadow:0 12px 30px rgba(0,0,0,.28)
}
.summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.summary div{padding:10px;border-radius:14px;background:rgba(21,55,47,.58);border:1px solid rgba(137,203,174,.13)}
.summary small{display:block;color:var(--muted);font-size:8px}
.summary b{display:block;font-size:12px;margin-top:4px}

.chartbox{height:170px;position:relative;margin-top:4px}
.gridline{position:absolute;left:0;right:0;border-top:1px dashed #252c1e}
.g1{top:20%}.g2{top:50%}.g3{top:80%}
.stepchart{position:absolute;inset:8px 3px 22px;display:flex;align-items:stretch;gap:3px}
.stepcol{flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center}
.step{width:100%;max-width:28px;border-radius:6px 6px 2px 2px;background:linear-gradient(#f3ff63,#b9ff3b)}
.step.net{background:linear-gradient(#efff58,#b6d50f)}
.step.exp{background:linear-gradient(#ff8d97,#ff6572)}
.xlabel{font-size:8px;color:var(--muted);margin-top:5px}
.legend{display:flex;gap:12px;margin-top:5px;font-size:9px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
.dot.blue{background:var(--blue)}.dot.red{background:var(--red)}.dot.green{background:var(--lime)}

/* Premium analytics chart: LittleBee-inspired smooth area/line graph */
.analytics{height:225px;position:relative;overflow:hidden;border-radius:18px;background:radial-gradient(70% 100% at 70% 35%,rgba(185,255,59,.055),transparent 65%)}
.analytics svg{width:100%;height:100%;display:block;overflow:visible}
.chart-grid{stroke:#24483d;stroke-width:1;stroke-dasharray:4 5;opacity:.72}
.chart-axis{fill:#718b80;font-size:8px;font-weight:650}
.area-income{fill:url(#areaIncome)}
.area-expense{fill:url(#areaExpense)}
.area-net{fill:url(#areaNet)}
.line-income{fill:none;stroke:#b9ff3b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;filter:url(#glowGreen)}
.line-expense{fill:none;stroke:#ff6572;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;filter:url(#glowRed)}
.line-net{fill:none;stroke:#78a6ff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;filter:url(#glowBlue)}
.point-income{fill:#b9ff3b;stroke:#11160d;stroke-width:2;filter:url(#glowGreen)}
.point-expense{fill:#ff6572;stroke:#17100f;stroke-width:2;filter:url(#glowRed)}
.point-net{fill:#78a6ff;stroke:#0d1018;stroke-width:2;filter:url(#glowBlue)}
.chart-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:7px;color:#9bb0a5;font-size:9px}
.chart-legend span{display:inline-flex;align-items:center;gap:5px}
.chart-legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chart-legend .lg{background:#b9ff3b;box-shadow:0 0 10px rgba(185,255,59,.55)}
.chart-legend .lr{background:#ff6572;box-shadow:0 0 10px rgba(255,101,114,.45)}
.chart-legend .lb{background:#78a6ff;box-shadow:0 0 10px rgba(120,166,255,.45)}
.chart-tip{position:absolute;right:12px;top:12px;padding:7px 9px;border-radius:11px;background:rgba(10,34,28,.94);border:1px solid #315a4b;box-shadow:0 8px 22px rgba(0,0,0,.35);font-size:8px;color:#aeb6a0}
.chart-tip b{display:block;color:#f3f8e9;font-size:10px;margin-top:2px}


/* Google login & cloud sync */
.cloudCard{background:linear-gradient(145deg,rgba(15,48,41,.92),rgba(6,25,21,.88));border:1px solid rgba(119,171,149,.20);border-radius:20px;padding:15px;box-shadow:0 12px 30px rgba(0,0,0,.30)}
.cloudUser{display:flex;align-items:center;gap:11px}
.cloudAvatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#18200f;border:1px solid #3a4820;color:var(--lime);overflow:hidden;font-weight:900}
.cloudAvatar img{width:100%;height:100%;object-fit:cover}
.cloudInfo{flex:1;min-width:0}.cloudInfo b{display:block;font-size:13px}.cloudInfo small{display:block;color:var(--muted);font-size:9px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cloudStatus{margin-top:10px;font-size:9px;color:var(--muted);display:flex;align-items:center;gap:6px}.cloudStatus i{width:7px;height:7px;border-radius:50%;background:#777;display:inline-block}.cloudStatus.online i{background:var(--lime);box-shadow:0 0 10px rgba(185,255,59,.55)}
.googleBtn,.cloudBtn{width:100%;border:1px solid rgba(137,203,174,.20);border-radius:13px;padding:12px 13px;margin-top:11px;font-weight:800;font-size:11px;background:#fff;color:#202124;display:flex;align-items:center;justify-content:center;gap:9px}.googleBtn span{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:900}.cloudBtn{background:rgba(17,55,47,.75);color:#eaf1df}.cloudBtn.danger{color:#ff9ba3}.cloudBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cloudBtns .cloudBtn{margin-top:8px}
.cloudHint{font-size:8px;color:var(--muted);line-height:1.5;margin-top:9px}

/* LittleBee-inspired glass system */
.heroCard,.mini,.card,.quick button,.txico,.nav,.balance{position:relative;overflow:hidden}
.heroCard::before,.mini::before,.card::before,.quick button::before,.txico::before,.nav::before,.balance::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.055),transparent 32%,rgba(185,255,59,.025) 72%,transparent);pointer-events:none}
.heroCard,.mini,.card,.quick button,.txico{box-shadow:0 14px 34px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.035)}

/* Soft colored shadows across the interface */
.card,.mini,.heroCard,.bigCard,.balance,.quick button,.nav{box-shadow:0 12px 30px rgba(0,0,0,.38),0 0 22px rgba(185,255,59,.035)}
.heroCard:nth-child(1){box-shadow:0 12px 30px rgba(0,0,0,.38),0 0 20px rgba(185,255,59,.08)}
.heroCard:nth-child(2){box-shadow:0 12px 30px rgba(0,0,0,.38),0 0 20px rgba(255,101,114,.07)}
.heroCard:nth-child(3){box-shadow:0 12px 30px rgba(0,0,0,.38),0 0 20px rgba(120,166,255,.08)}
.summary div:nth-child(1){box-shadow:inset 0 0 18px rgba(185,255,59,.035)}
.summary div:nth-child(2){box-shadow:inset 0 0 18px rgba(255,101,114,.035)}
.summary div:nth-child(3){box-shadow:inset 0 0 18px rgba(120,166,255,.04)}
.quick button:hover,.heroCard:hover,.mini:hover{transform:translateY(-1px)}
.quick button,.heroCard,.mini{transition:transform .18s ease,box-shadow .18s ease}

.donutwrap{display:flex;align-items:center;gap:18px}
.donut{
 width:128px;height:128px;border-radius:50%;
 background:conic-gradient(var(--lime) 0 45%,var(--red) 45% 78%,#52665c 78% 100%);
 display:grid;place-items:center;flex:none
}
.donut:after{content:"";width:78px;height:78px;border-radius:50%;background:#10140e}
.donutcenter{position:absolute;text-align:center}
.donutcenter b{display:block;font-size:15px}.donutcenter small{font-size:8px;color:var(--muted)}
.legendlist{font-size:10px;line-height:2.2;color:#b2b9a4}
.legendlist span{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}

.tx{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #20271a}
.tx:last-child{border-bottom:0}
.txico{
 width:39px;height:39px;border-radius:13px;background:rgba(25,62,52,.52);border:1px solid rgba(137,203,174,.15);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
 display:grid;place-items:center;color:var(--lime);font-size:17px
}
.txmain{flex:1}.txmain b{font-size:12px}.txmain small{display:block;color:var(--muted);font-size:9px;margin-top:2px}
.amount{font-size:12px;font-weight:850}

.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{
 border:1px solid rgba(137,203,174,.16);background:rgba(15,47,40,.62);border-radius:16px;padding:11px 4px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
 font-size:9px;color:#cbd2bc;box-shadow:0 8px 22px rgba(0,0,0,.22)
}
.quick i{
 width:32px;height:32px;border-radius:50%;display:grid;place-items:center;margin:0 auto 6px;
 font-style:normal;font-size:16px;background:#18200f;color:var(--lime);border:1px solid #3a4820
}

.nav{
 position:fixed;bottom:10px;left:50%;transform:translateX(-50%);
 width:min(450px,calc(100% - 26px));height:66px;background:rgba(5,20,16,.88);
 border:1px solid rgba(137,203,174,.18);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:30px;display:flex;
 box-shadow:0 15px 38px rgba(0,0,0,.58);z-index:20
}
.nav button{flex:1;border:0;background:none;color:#777e70;font-size:9px;font-weight:800}
.nav button span{display:block;font-size:18px;margin-bottom:2px}
.nav button.active{color:var(--lime)}
.nav button.active span{
 background:rgba(185,255,59,.13);color:var(--lime);padding:4px 12px;border-radius:18px;width:max-content;margin:auto;box-shadow:0 0 20px rgba(185,255,59,.12)
}
/* Pengaturan: typography & controls */
.settingsGroup{display:flex;flex-direction:column;gap:0}
.settingsRow{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:15px 0;border-bottom:1px solid rgba(116,158,140,.14)}
.settingsRow:last-child{border-bottom:0}
.settingsRow .label{font-size:14px;line-height:1.35;font-weight:750;letter-spacing:-.1px;color:#eef3e8}
.settingsRow .label small{display:block;margin-top:4px;color:var(--muted);font-size:9px;line-height:1.45;font-weight:500;letter-spacing:0}
.settingsInput{width:100%;height:46px;border:1px solid rgba(137,203,174,.2);background:#10170f;border-radius:13px;padding:0 13px;color:#f7f9ef;font-size:15px;font-weight:650;outline:none}
.settingsInput:focus{border-color:var(--lime);box-shadow:0 0 0 3px rgba(185,255,59,.08)}
.settingsActions{display:grid;grid-template-columns:1fr 1.55fr;gap:8px;margin-top:14px}
.settingsActions button{min-height:44px;border:1px solid rgba(137,203,174,.18);background:#111811;color:#dce4d5;border-radius:13px;font-size:11px;font-weight:800;padding:10px}
.settingsActions button.primary{border-color:var(--lime);background:var(--lime);color:#10150b}
.settingSwitch{position:relative;width:48px;height:28px;border:0;border-radius:20px;background:#26322a;padding:0;justify-self:start}
.settingSwitch:after{content:"";position:absolute;width:20px;height:20px;left:4px;top:4px;border-radius:50%;background:#aab5aa;transition:.2s}
.settingSwitch.on{background:rgba(185,255,59,.32)}
.settingSwitch.on:after{left:24px;background:var(--lime)}
.dataGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dataGrid button{min-height:64px;border:1px solid rgba(137,203,174,.16);background:rgba(15,47,40,.65);color:#dce4d5;border-radius:15px;padding:9px 5px;font-size:9px;font-weight:800}
.dataGrid button strong{display:block;color:var(--lime);font-size:16px;margin-bottom:5px}
@media(max-width:360px){.dataGrid{grid-template-columns:repeat(2,1fr)}}
.fab{
 position:fixed;right:max(24px,calc((100vw - 480px)/2 + 20px));bottom:88px;
 width:53px;height:53px;border:1px solid #eaff6a;border-radius:50%;
 background:var(--lime);color:#07130f;font-size:25px;box-shadow:0 10px 28px rgba(185,255,59,.24),0 0 24px rgba(185,255,59,.12);z-index:19
}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:end;z-index:40}
.sheet{
 width:min(480px,100%);margin:auto;background:#0b0e09;border:1px solid #2d371f;
 border-bottom:0;border-radius:24px 24px 0 0;padding:18px 18px 28px;max-height:90vh;overflow:auto;color:#fff
}
.handle{width:40px;height:4px;background:#3b4530;border-radius:8px;margin:0 auto 15px}
label{display:block;color:#9ea791;font-size:10px;font-weight:800;margin:11px 0 5px}
input,select{
 width:100%;border:1px solid #303a24;background:#141911;border-radius:13px;padding:13px;
 font-size:15px;color:#fff
}
.save{width:100%;border:0;border-radius:14px;background:var(--lime);color:#101408;padding:14px;font-weight:900;margin-top:15px}
.cancel{width:100%;border:1px solid #303a24;background:#11150f;border-radius:14px;padding:12px;margin-top:8px;color:#c2c9b6;font-weight:800}

.pageTitle{padding:21px 18px 10px;font-size:25px;line-height:1.12;letter-spacing:-.5px;font-weight:850}
.bigCard{
 margin:0 15px;background:
 radial-gradient(90% 130% at 100% 0%,rgba(185,255,59,.25),transparent 60%),
 linear-gradient(145deg,#12180e,#080a07);
 color:#fff;border:1px solid #3a4622;border-radius:23px;padding:20px;box-shadow:var(--shadow)
}
.bigCard small{opacity:.72;font-size:10px}.bigCard h1{font-size:32px;margin:5px 0}
.assetrow{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #222a19}
.assetrow:last-child{border:0}
.pill{display:inline-block;background:#20290f;color:var(--lime);padding:4px 8px;border-radius:10px;font-size:8px;font-weight:800}
.toast{
 position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#e8ff56;color:#11150b;
 padding:10px 15px;border-radius:18px;font-size:10px;font-weight:900;z-index:100;display:none
}

/* Home: iPhone/Vaulta-like hierarchy */
.heroCards{display:flex;gap:10px;overflow-x:auto;padding:1px 2px 5px;scrollbar-width:none}
.heroCards::-webkit-scrollbar{display:none}
.heroCard{
 min-width:154px;height:112px;padding:13px;border-radius:17px;
 background:linear-gradient(145deg,#161d10,#0c100a);border:1px solid #2f391f;
 box-shadow:0 10px 25px rgba(0,0,0,.28);position:relative;overflow:hidden
}
.heroCard:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;right:-35px;bottom:-45px;background:rgba(185,255,59,.11)}
.heroCard .hcicon{font-size:16px;color:var(--lime);margin-bottom:8px}
.heroCard small{display:block;color:#9bb0a5;font-size:8px}.heroCard b{display:block;font-size:15px;margin-top:4px}
.heroCard span{position:absolute;left:13px;bottom:10px;font-size:8px;color:#737b6c}

.quickTitle{display:flex;align-items:center;justify-content:space-between}

/* Full Portfolio dashboard */
.portfolioHero{margin:0 15px;padding:18px;border-radius:24px;background:radial-gradient(90% 120% at 100% 0%,rgba(185,255,59,.18),transparent 60%),linear-gradient(145deg,rgba(16,55,45,.96),rgba(5,24,20,.94));border:1px solid rgba(137,203,174,.2);box-shadow:var(--shadow),0 0 28px rgba(185,255,59,.045)}
.portfolioHero small{color:#9fb1a5;font-size:9px}.portfolioHero h1{font-size:31px;letter-spacing:-1px;margin:5px 0}.pchange{display:flex;gap:8px;align-items:center;font-size:10px}.pchange.up{color:var(--lime)}.pchange.down{color:var(--red)}
.rangeTabs{display:flex;gap:6px;overflow:auto;scrollbar-width:none;margin-top:14px}.rangeTabs::-webkit-scrollbar{display:none}.rangeTabs button{border:1px solid rgba(137,203,174,.14);background:rgba(10,35,29,.7);color:#aeb8a8;border-radius:10px;padding:7px 11px;font-size:9px;font-weight:850;white-space:nowrap}.rangeTabs button.active{background:var(--lime);color:#11160b;border-color:var(--lime)}
.pChartCard{margin-top:10px}.pChartMeta{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px}.pChartMeta b{font-size:15px}.pChartMeta small{color:var(--muted);font-size:8px}.portfolioAnalytics{height:240px;position:relative;overflow:hidden;border-radius:18px;background:radial-gradient(70% 100% at 70% 35%,rgba(185,255,59,.065),transparent 65%)}
.portfolioAnalytics svg{width:100%;height:100%;display:block;overflow:visible}.portfolioAnalytics .chart-grid{stroke:#24483d;stroke-width:1;stroke-dasharray:4 6;opacity:.55}.portfolioAnalytics .chart-axis{fill:#718b80;font-size:8px;font-weight:650}.portfolioAnalytics .pLine{fill:none;stroke:#69f58a;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;filter:url(#portfolioGlow2)}.portfolioAnalytics .pArea{fill:url(#portfolioArea2)}
.pTooltip{position:absolute;left:12px;top:12px;padding:7px 9px;border-radius:11px;background:rgba(7,28,23,.92);border:1px solid #315a4b;font-size:8px;color:#aeb6a0;z-index:2;display:none}.pTooltip b{display:block;color:#f3f8e9;font-size:10px;margin-top:2px}.pTooltip span{display:block;color:#aeb6a0;font-size:8px}.pMarker{pointer-events:none}.pMarkerLine{stroke:#6bf58b;stroke-width:1;stroke-dasharray:3 4;opacity:.55}.pMarkerDot{fill:#b9ff3b;stroke:#0a1710;stroke-width:2;filter:url(#portfolioGlow2)}.pHover{fill:#b9ff3b;stroke:#08130e;stroke-width:2;filter:url(#portfolioGlow2)}
.portStats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.portStat{padding:11px;border-radius:15px;background:rgba(15,48,41,.7);border:1px solid rgba(119,171,149,.15)}.portStat small{display:block;color:var(--muted);font-size:8px}.portStat b{display:block;font-size:11px;margin-top:4px}

function recentAll(){return d.tx.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).map(x=>`<div class="tx"><div class="txico">${x.type==="income"?"↗":x.type==="pay"?"◇":"↘"}</div><div class="txmain"><b>${x.desc}</b><small>${fd(x.date)} • ${x.type}</small></div><div class="amount ${x.type==="income"?"green":"red"}">${x.type==="income"?"+":"-"}${rp(x.amount)}</div></div>`).join("")||'<div style="text-align:center;color:var(--muted);padding:20px">Belum ada transaksi.</div>'}
function portfolioRange(daysCount){
  const end=new Date(); end.setHours(0,0,0,0);
  let start=new Date(end);
  if(daysCount==='all'){
    const dates=d.tx.map(x=>new Date(x.date+'T00:00:00')).filter(x=>!isNaN(x));
    start=dates.length?new Date(Math.min(...dates.map(x=>x.getTime()))):new Date(end);
  }else{start.setDate(start.getDate()-(Number(daysCount)-1));}
  const out=[];
  for(let z=new Date(start);z<=end;z.setDate(z.getDate()+1)){
    const s=z.toISOString().slice(0,10);
    const flow=d.tx.filter(x=>x.date===s).reduce((a,x)=>a+(x.type==='income'?x.amount:-x.amount),0);
    const before=d.tx.filter(x=>x.date<s).reduce((a,x)=>a+(x.type==='income'?x.amount:-x.amount),0);
    const value=Math.max(0,d.savings+before+flow);
    out.push({date:s,value,full:z.toLocaleDateString('id-ID',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})});
  }
  return out.length?out:[{date:end.toISOString().slice(0,10),value:Math.max(0,d.savings),full:end.toLocaleDateString('id-ID',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}];
}
function portfolioChart(points){
  const W=620,H=250,pL=8,pR=8,pT=20,pB=32;
  const vals=points.map(x=>x.value),hi=Math.max(...vals,1),lo=Math.min(...vals,0),span=Math.max(hi-lo,1);
  const X=i=>pL+i*((W-pL-pR)/Math.max(points.length-1,1)),Y=v=>pT+(H-pT-pB)*(1-(v-lo)/span);
  const raw=points.map((x,i)=>[X(i),Y(x.value)]);
  const pts=raw.length>2?raw.map((p,i)=>{if(i===0||i===raw.length-1)return p;return[(raw[i-1][0]+p[0]+raw[i+1][0])/3,(raw[i-1][1]+p[1]+raw[i+1][1])/3]}):raw;
  let path=pts.map((p,i)=>{if(!i)return'M'+p[0]+','+p[1];let a=pts[i-1],cx=(a[0]+p[0])/2;return'C'+cx+','+a[1]+' '+cx+','+p[1]+' '+p[0]+','+p[1]}).join(' ');
  const area=path+' L'+pts[pts.length-1][0]+','+(H-pB)+' L'+pts[0][0]+','+(H-pB)+' Z';
  const step=Math.max(1,Math.ceil(points.length/7));
  const labels=points.map((x,i)=>i%step===0||i===points.length-1?`<text class="chart-axis" x="${X(i)}" y="${H-9}" text-anchor="middle">${new Date(x.date+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short'}).replace('.','')}</text>`:'').join('');
  return `<svg viewBox="0 0 ${W} ${H}" data-points='${JSON.stringify(points).replace(/'/g,'&#39;')}'><defs><linearGradient id="portfolioArea2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#69f58a" stop-opacity=".32"/><stop offset="70%" stop-color="#69f58a" stop-opacity=".08"/><stop offset="100%" stop-color="#69f58a" stop-opacity="0"/></linearGradient><filter id="portfolioGlow2" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><line class="chart-grid" x1="${pL}" y1="${pT+20}" x2="${W-pR}" y2="${pT+20}"/><line class="chart-grid" x1="${pL}" y1="${pT+80}" x2="${W-pR}" y2="${pT+80}"/><line class="chart-grid" x1="${pL}" y1="${pT+140}" x2="${W-pR}" y2="${pT+140}"/><path class="pArea" d="${area}"/><path class="pLine" d="${path}"/>${labels}</svg>`;
}
function portfolio(){
  const t=totals(),cash=Math.max(0,t.income-t.expense-t.pay),savings=Math.max(0,d.savings),total=cash+savings;

  $id('app').innerHTML=`

  <div class="section"><div class="head"><h2>Komposisi Portofolio</h2><span class="sub">Saat ini</span></div><div class="card"><div class="alloc"><div class="allocDonut" style="background:conic-gradient(var(--lime) 0 ${cashPct}%,#52665c ${cashPct}% 100%)"><div class="allocCenter"><div><b>${rp(total)}</b><small>Total aset</small></div></div></div><div class="allocList"><div class="allocItem"><span><i class="allocDot" style="background:var(--lime)"></i>Saldo tersedia</span><b>${rp(cash)}</b></div><div class="allocItem"><span><i class="allocDot" style="background:#52665c"></i>Tabungan</span><b>${rp(savings)}</b></div><div class="allocItem"><span>Komposisi</span><b>${cashPct}% / ${savePct}%</b></div></div></div></div></div>
  <div class="section"><div class="head"><h2>Aset & Kewajiban</h2><button class="link" onclick="settingsPrompt()">Atur</button></div><div class="card"><div class="assetrow"><div class="assetlabel"><div class="asseticon">◈</div><span>Saldo tersedia<small>Setelah pengeluaran & pelunasan</small></span></div><b>${rp(cash)}</b></div><div class="assetrow"><div class="assetlabel"><div class="asseticon">▣</div><span>Tabungan<small>Dana yang disimpan</small></span></div><b>${rp(savings)}</b></div><div class="assetrow"><div class="assetlabel"><div class="asseticon">◇</div><span>Kewajiban tersisa<small>Belum dilunasi</small></span></div><b class="${d.obligation?'red':'green'}">${rp(d.obligation)}</b></div></div></div>
  <div class="section"><div class="head"><h2>Perubahan Terbaru</h2><button class="link" onclick="render('transactions')">Lihat semua ↗</button></div><div class="card">${recent.map(x=>`<div class="tx"><div class="txico">${x.type==='income'?'↗':x.type==='pay'?'◇':'↘'}</div><div class="txmain"><b>${x.desc}</b><small>${fd(x.date)} • ${x.type==='income'?'Dana masuk':x.type==='pay'?'Pelunasan':'Pengeluaran'}</small></div><div class="amount ${x.type==='income'?'green':'red'}">${x.type==='income'?'+':'-'}${rp(x.amount)}</div></div>`).join('')||'<div style="text-align:center;color:var(--muted);padding:20px;font-size:10px">Belum ada perubahan portofolio.</div>'}</div></div>
  <div class="section"><div class="head"><h2>Aksi Portofolio</h2><span class="sub">Kelola dana</span></div><div class="portfolioActions"><button onclick="quick('income')"><strong>＋</strong>Tambah dana</button><button onclick="quick('expense')"><strong>↘</strong>Catat pengeluaran</button><button onclick="quick('pay')"><strong>◇</strong>Bayar kewajiban</button><button onclick="settingsPrompt()"><strong>⚙</strong>Pengaturan aset</button></div></div>`;
  attachPortfolioHover(points);

function portfolioSetRange(n,btn){document.querySelectorAll('.rangeTabs button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');const wrap=$id('portfolioChartWrap');if(!wrap)return;const pts=portfolioRange(n);wrap.innerHTML=portfolioChart(pts)+'<div class="pTooltip" id="pTooltip"></div>';const meta=wrap.parentElement.querySelector('.pChartMeta .pill');if(meta)meta.textContent=n==='all'?'Semua':n===365?'1 tahun':n===90?'3 bulan':n===30?'30 hari':'7 hari';attachPortfolioHover(pts)}
function attachPortfolioHover(points){
  const wrap=$id('portfolioChartWrap');
  if(!wrap)return;
  const svg=wrap.querySelector('svg'),tip=$id('pTooltip');
  if(!svg||!tip)return;
  const W=620,H=250,pL=8,pR=8,pT=20,pB=32;
  let marker=svg.querySelector('.pMarker');
  if(!marker){
    marker=document.createElementNS('http://www.w3.org/2000/svg','g');
    marker.setAttribute('class','pMarker');
    marker.innerHTML='<line class="pMarkerLine" x1="0" y1="20" x2="0" y2="218"/><circle class="pMarkerDot" cx="0" cy="0" r="5"/>';
    marker.style.display='none';
    svg.appendChild(marker);
  }
  const select=e=>{
    const r=svg.getBoundingClientRect();
    const x=Math.max(0,Math.min(r.width,e.clientX-r.left));
    const ratio=Math.max(0,Math.min(1,x/r.width));
    const i=Math.min(points.length-1,Math.round(ratio*(points.length-1))),p=points[i];
    const px=pL+i*((W-pL-pR)/Math.max(points.length-1,1));
    const vals=points.map(x=>x.value),hi=Math.max(...vals,1),lo=Math.min(...vals,0),span=Math.max(hi-lo,1);
    const py=pT+(H-pT-pB)*(1-(p.value-lo)/span);
    marker.setAttribute('transform',`translate(${px},0)`);
    marker.querySelector('.pMarkerDot').setAttribute('cy',py);
    marker.style.display='block';
    tip.style.display='block';
    const left=Math.min(Math.max(8,x+10),Math.max(8,r.width-150));
    tip.style.left=left+'px';
    tip.style.top='10px';
    tip.innerHTML=`<span>${p.full}</span><b>${rp(p.value)}</b>`;
  };
  svg.addEventListener('pointerdown',e=>{e.preventDefault();select(e)});
  svg.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'&&e.buttons===0)return;select(e)});
  svg.addEventListener('pointerleave',()=>{if(window.matchMedia&&window.matchMedia('(pointer:fine)').matches){tip.style.display='none';marker.style.display='none'}});
  svg.addEventListener('touchstart',e=>{if(e.touches[0]){e.preventDefault();select(e.touches[0])}},{passive:false});
  svg.addEventListener('touchmove',e=>{if(e.touches[0]){e.preventDefault();select(e.touches[0])}},{passive:false});
}
function reportRange(mode,from,to){
  const now=new Date();now.setHours(0,0,0,0);
  let end=to?new Date(to+'T00:00:00'):new Date(now);
  let start=from?new Date(from+'T00:00:00'):new Date(now);
  if(!from){
    if(mode==='today') start=new Date(end);
    else if(mode==='week'){start=new Date(end);start.setDate(start.getDate()-6)}
    else if(mode==='month'){start=new Date(end.getFullYear(),end.getMonth(),1)}
    else if(mode==='year'){start=new Date(end.getFullYear(),0,1)}
    else {start=new Date(end);start.setDate(start.getDate()-29)}
  }
  if(!to && mode==='all'){
    const dates=d.tx.map(x=>new Date(x.date+'T00:00:00')).filter(x=>!isNaN(x));
    start=dates.length?new Date(Math.min(...dates.map(x=>x.getTime()))):new Date(end);
  }
  if(start>end){const tmp=start;start=end;end=tmp}
  const a=start.toISOString().slice(0,10),b=end.toISOString().slice(0,10);
  return {start,end,from:a,to:b,tx:d.tx.filter(x=>x.date>=a&&x.date<=b).sort((x,y)=>y.date.localeCompare(x.date)||y.id-x.id)};
}
function report(){
  const mode=window.reportMode||'month';
  const customFrom=window.reportFrom||'';
  const customTo=window.reportTo||'';
  const r=reportRange(mode,mode==='custom'?customFrom:'',mode==='custom'?customTo:'');
  const sum=r.tx.reduce((a,x)=>{a[x.type]=(a[x.type]||0)+Number(x.amount||0);return a},{income:0,expense:0,pay:0});
  const net=sum.income-sum.expense;
  const totalFlow=Math.max(sum.income+sum.expense+sum.pay,1);
  const incomeW=sum.income/totalFlow*100,expenseW=sum.expense/totalFlow*100,payW=sum.pay/totalFlow*100;
  const expenseByDesc={};
  r.tx.filter(x=>x.type==='expense').forEach(x=>{const k=(x.desc||'Tanpa keterangan').trim()||'Tanpa keterangan';expenseByDesc[k]=(expenseByDesc[k]||0)+Number(x.amount||0)});
  const expenseRows=Object.entries(expenseByDesc).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const daily={};
  r.tx.forEach(x=>{daily[x.date]??={income:0,expense:0,pay:0};daily[x.date][x.type]+=Number(x.amount||0)});
  const days=Object.entries(daily).sort((a,b)=>b[0].localeCompare(a[0]));
  const fmtRange=`${r.start.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})} – ${r.end.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})}`;
  $id('app').innerHTML=`
  <div class="pageTitle">Laporan Keuangan <span class="sub" style="float:right;margin-top:10px">${fmtRange}</span></div>
  <div class="section"><div class="reportTabs">
    <button class="${mode==='today'?'active':''}" onclick="setReportMode('today')">Hari ini</button>
    <button class="${mode==='week'?'active':''}" onclick="setReportMode('week')">7 hari</button>
    <button class="${mode==='month'?'active':''}" onclick="setReportMode('month')">Bulan ini</button>
    <button class="${mode==='year'?'active':''}" onclick="setReportMode('year')">Tahun ini</button>
    <button class="${mode==='all'?'active':''}" onclick="setReportMode('all')">Semua</button>
    <button class="${mode==='custom'?'active':''}" onclick="setReportMode('custom')">Tanggal</button>
  </div>
  ${mode==='custom'?`<div class="card" style="margin-bottom:10px"><div class="reportFilter"><div><label>Dari</label><input id="reportFrom" type="date" value="${customFrom||r.from}"></div><div><label>Sampai</label><input id="reportTo" type="date" value="${customTo||r.to}"></div></div><button class="save" onclick="applyReportCustom()">Terapkan Filter</button></div>`:''}
  <div class="card"><div class="head"><h2>Ringkasan</h2><span class="pill">${r.tx.length} transaksi</span></div><div class="reportSummary">
    <div class="reportMetric"><small>Pemasukan</small><b class="green">${rp(sum.income)}</b></div>
    <div class="reportMetric"><small>Pengeluaran</small><b class="red">${rp(sum.expense)}</b></div>
    <div class="reportMetric"><small>Laba bersih</small><b class="blue">${rp(net)}</b></div>
    <div class="reportMetric"><small>Pelunasan</small><b>${rp(sum.pay)}</b></div>
    <div class="reportMetric wide"><small>Arus dana</small><div class="reportBar"><span class="barIn" style="width:${incomeW}%"></span><span class="barOut" style="width:${expenseW}%"></span><span class="barPay" style="width:${payW}%"></span></div><div class="reportLegend"><span><i style="background:var(--lime)"></i>Pemasukan ${rp(sum.income)}</span><span><i style="background:var(--red)"></i>Pengeluaran ${rp(sum.expense)}</span><span><i style="background:#7f8b84"></i>Pelunasan ${rp(sum.pay)}</span></div></div>
  </div></div></div>
  <div class="section"><div class="head"><h2>Pengeluaran Terbesar</h2><span class="sub">berdasarkan keterangan</span></div><div class="card reportList">${expenseRows.map(([k,v])=>`<div class="assetrow"><span>${k}<small>${sum.expense?((v/sum.expense)*100).toFixed(1):0}% dari pengeluaran</small></span><b class="red">-${rp(v)}</b></div>`).join('')||'<div class="reportEmpty">Belum ada pengeluaran pada periode ini.</div>'}</div></div>
  <div class="section"><div class="head"><h2>Ringkasan Harian</h2><span class="sub">paling baru</span></div><div class="card reportList">${days.map(([date,v])=>`<div class="assetrow"><span>${fd(date)}<small>${v.income?`Masuk ${rp(v.income)} · `:''}${v.expense?`Keluar ${rp(v.expense)} · `:''}${v.pay?`Lunas ${rp(v.pay)}`:''}</small></span><b class="${v.income-v.expense>=0?'green':'red'}">${v.income-v.expense>=0?'+':'-'}${rp(Math.abs(v.income-v.expense))}</b></div>`).join('')||'<div class="reportEmpty">Belum ada transaksi pada periode ini.</div>'}</div></div>
  <div class="section"><div class="head"><h2>Riwayat Transaksi</h2><button class="link" onclick="render('transactions')">Lihat semua ↗</button></div><div class="card reportList">${r.tx.slice(0,10).map(x=>`<div class="tx"><div class="txico">${x.type==='income'?'↗':x.type==='pay'?'◇':'↘'}</div><div class="txmain"><b>${x.desc}</b><small>${fd(x.date)} • ${x.type==='income'?'Pemasukan':x.type==='pay'?'Pelunasan':'Pengeluaran'}</small></div><div class="amount ${x.type==='income'?'green':'red'}">${x.type==='income'?'+':'-'}${rp(x.amount)}</div></div>`).join('')||'<div class="reportEmpty">Belum ada transaksi.</div>'}</div></div>
  <div class="section"><div class="reportActions"><button onclick="exportReport()"><strong>⇩</strong>Export CSV</button><button onclick="printReport()"><strong>▣</strong>Cetak / Simpan PDF</button></div></div>`;
}
function setReportMode(mode){window.reportMode=mode;window.reportFrom='';window.reportTo='';render('report')}
function applyReportCustom(){window.reportMode='custom';window.reportFrom=$id('reportFrom').value;window.reportTo=$id('reportTo').value;if(!window.reportFrom||!window.reportTo){showToast('Pilih tanggal dari dan sampai');return}render('report')}

/* Opening sound system — synthesized cinematic SFX; mobile browsers require a user gesture */
let openingAudioCtx=null, openingMaster=null, openingSoundStarted=false;
function initOpeningAudio(){
  if(openingAudioCtx) return true;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return false;
    openingAudioCtx=new AC();
    openingMaster=openingAudioCtx.createGain();
    openingMaster.gain.value=0.18;
    openingMaster.connect(openingAudioCtx.destination);
    return true;
  }catch(e){return false}
}
function tone(freq,when,duration,type='sine',gain=.16){
  if(!openingAudioCtx||!openingMaster) return;
  const now=openingAudioCtx.currentTime;
  const o=openingAudioCtx.createOscillator(),g=openingAudioCtx.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,now+when);
  g.gain.setValueAtTime(.0001,now+when);
  g.gain.exponentialRampToValueAtTime(gain,now+when+.025);
  g.gain.exponentialRampToValueAtTime(.0001,now+when+duration);
  o.connect(g);g.connect(openingMaster);o.start(now+when);o.stop(now+when+duration+.04);
}
function whoosh(when=0){
  if(!openingAudioCtx||!openingMaster) return;
  const now=openingAudioCtx.currentTime;
  const o=openingAudioCtx.createOscillator(),g=openingAudioCtx.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(90,now+when);
  o.frequency.exponentialRampToValueAtTime(900,now+when+.72);
  g.gain.setValueAtTime(.0001,now+when);
  g.gain.exponentialRampToValueAtTime(.13,now+when+.18);
  g.gain.exponentialRampToValueAtTime(.0001,now+when+.78);
  o.connect(g);g.connect(openingMaster);o.start(now+when);o.stop(now+when+.82);
}
function startOpeningSound(){
  if(openingSoundStarted||!openingAudioCtx) return;
  openingSoundStarted=true;
  if(openingAudioCtx.state==='suspended') openingAudioCtx.resume();
  tone(98,0,.75,'sine',.10);
  tone(147,.12,1.0,'sine',.07);
  whoosh(.35);
  tone(293.66,1.75,.48,'triangle',.11);
  tone(440,2.55,.60,'triangle',.10);
  tone(587.33,3.55,.72,'sine',.12);
  tone(880,4.18,.85,'sine',.08);
}
function unlockOpeningAudio(){
  if(!initOpeningAudio()) return;
  if(openingAudioCtx.state==='suspended') openingAudioCtx.resume();
  startOpeningSound();
  const b=document.getElementById('openingSoundBtn');
  if(b){b.textContent='🔊 SUARA AKTIF';b.classList.add('ready');}
}
function setupOpeningAudio(){
  initOpeningAudio();
  // Coba mulai otomatis saat opening tampil. Browser yang mengizinkan autoplay akan langsung bunyi.
  // Jika browser menahan autoplay, listener interaksi tetap menjadi fallback.
  try{
    if(openingAudioCtx && openingAudioCtx.state !== 'running') openingAudioCtx.resume().then(()=>startOpeningSound()).catch(()=>{});
    else startOpeningSound();
  }catch(e){}
  const b=document.getElementById('openingSoundBtn');
  if(b) b.addEventListener('click',unlockOpeningAudio,{passive:true});
  ['pointerdown','touchstart','keydown'].forEach(ev=>window.addEventListener(ev,unlockOpeningAudio,{once:true,passive:true}));
}
setupOpeningAudio();

function localData(){
  try{return JSON.parse(localStorage.getItem('keuangan_iphone_style_v2')||'null') || {salary:85000,limit:30000,obligation:0,savings:0,targetSavings:0,tx:[]};}

function writeLocal(data){localStorage.setItem('keuangan_iphone_style_v2',JSON.stringify(data));}
function normalize(data){
  data=data||{}; data.tx=Array.isArray(data.tx)?data.tx:[];
  ['salary','limit','obligation','savings','targetSavings'].forEach(k=>data[k]=Math.max(0,Number(data[k]||0)));
  data.tx=data.tx.map(x=>({...x,id:Number(x.id)||Date.now()+Math.random(),amount:Number(x.amount)||0,type:x.type||'expense',date:x.date||new Date().toISOString().slice(0,10),desc:x.desc||'Transaksi'}));
  return data;
}
function mergeData(local,cloud){
  local=normalize(local); cloud=normalize(cloud);
  const byId=new Map();
  [...cloud.tx,...local.tx].forEach(x=>byId.set(String(x.id),x));
  const merged={...cloud,...local,tx:[...byId.values()].sort((a,b)=>Number(a.id)-Number(b.id))};
  // Keep cloud settings when they exist; otherwise preserve local values.
  ['salary','limit','obligation','savings','targetSavings'].forEach(k=>{
    if(cloud[k]===undefined || cloud[k]===null) merged[k]=local[k];
    else merged[k]=Number(cloud[k]);
  });
  return merged;
}
async function saveCloud(){
  if(!currentUser||!db)return false;
  const data=normalize(localData());
  await setDoc(doc(db,'users',currentUser.uid,'app','data'),{
    ...data,
    uid:currentUser.uid,
    email:currentUser.email||'',
    displayName:currentUser.displayName||'',
    updatedAt:serverTimestamp()
  });
  return true;
}
async function sync(){
  if(!currentUser||!db){
    showToast('Silakan login Google terlebih dahulu');
    return false;
  }

  // Give immediate feedback so the button never looks dead.
  const syncButtons=[...document.querySelectorAll('.cloudBtn:not(.danger)')];
  syncButtons.forEach(b=>{b.disabled=true;b.dataset.oldText=b.textContent;b.textContent='⏳ Menyinkronkan...';});
  const finish=()=>syncButtons.forEach(b=>{b.disabled=false;b.textContent=b.dataset.oldText||'↻ Sinkronkan';});

  try{
    const ref=doc(db,'users',currentUser.uid,'app','data');
    const local=normalize(localData());

    // Firestore can wait for network for a long time. Cap the read so the UI
    // remains responsive and report the actual problem to the user.
    const readPromise=getDoc(ref);
    const timeout=new Promise((_,reject)=>setTimeout(()=>reject(new Error('SYNC_TIMEOUT')),8000));

    let snap;
    try{
      snap=await Promise.race([readPromise,timeout]);
    }catch(readErr){
      if(readErr && readErr.message==='SYNC_TIMEOUT'){
        finish();
        showToast('Koneksi cloud terlalu lama. Coba lagi saat internet stabil.');
        return false;
      }
      throw readErr;
    }

    if(!snap.exists()){
      await setDoc(ref,{
        ...local,
        uid:currentUser.uid,
        email:currentUser.email||'',
        displayName:currentUser.displayName||'',
        createdAt:serverTimestamp(),
        updatedAt:serverTimestamp()
      });
      showToast('Data HP berhasil di-upload ke cloud');
    }else{
      const cloud=snap.data();
      const merged=mergeData(local,cloud);
      writeLocal(merged);
      if(window.__keuanganSetData) window.__keuanganSetData(merged);

      const writePromise=setDoc(ref,{
        ...merged,
        uid:currentUser.uid,
        email:currentUser.email||'',
        displayName:currentUser.displayName||'',
        updatedAt:serverTimestamp()
      });
      const writeTimeout=new Promise((_,reject)=>setTimeout(()=>reject(new Error('SYNC_WRITE_TIMEOUT')),8000));
      await Promise.race([writePromise,writeTimeout]);
      showToast('Data cloud berhasil disinkronkan');
    }

    if(window.updateCloudAccountCard) window.updateCloudAccountCard();
    if(window.render) window.render('account');
    finish();
    return true;
  }catch(e){
    console.error('Cloud sync:',e);
    finish();
    let msg=e.code||e.message||'Kesalahan tidak diketahui';
    if(e.code==='permission-denied') msg='Akses Firestore ditolak. Periksa Firestore Rules.';
    else if(e.code==='unavailable') msg='Firestore sedang tidak tersedia. Coba lagi.';
    else if(e.message==='SYNC_WRITE_TIMEOUT') msg='Upload cloud terlalu lama. Periksa koneksi internet.';
    showToast('Sinkronisasi gagal: '+msg);
    return false;
  }
}

      if(user){await sync();}
    });
  }catch(e){console.error('Firebase init failed',e);showToast('Firebase gagal dimulai');}
}else updateCard();
</script>
</body>
</html>
