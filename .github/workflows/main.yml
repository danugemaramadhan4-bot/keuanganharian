name: Build Keuangan Harian Native APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/main.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Find and Extract Native Project
        run: |
          set -e

          echo "Mencari ZIP aplikasi native..."
          rm -rf extracted native-project
          mkdir -p extracted

          ZIP_FILE=""

          while IFS= read -r f; do
            echo "Menguji: $f"

            if unzip -l "$f" | grep -Eq '(^|/)(settings\.gradle\.kts|settings\.gradle)$'; then
              ZIP_FILE="$f"
              echo "ZIP native ditemukan: $f"
              break
            fi
          done < <(
            find . -maxdepth 1 -type f -iname "*.zip" \
            ! -name "Keuangan_Harian_PWA.zip" \
            ! -name "*PWA*" | sort
          )

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP project Android tidak ditemukan."
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR=$(find extracted -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle tidak ditemukan."
            exit 1
          fi

          echo "Project ditemukan: $PROJECT_DIR"

          mv "$PROJECT_DIR" native-project

          echo "Project native siap."

      - name: Fix Kotlin for AGP 9
        working-directory: native-project
        run: |
          set -e

          echo "Menghapus plugin Kotlin Android lama..."

          find . -name "build.gradle.kts" -type f -print0 | while IFS= read -r -d '' file; do
            sed -i '/id("org.jetbrains.kotlin.android")/d' "$file"
            sed -i "/id('org.jetbrains.kotlin.android')/d" "$file"
          done

          echo "Menghapus konfigurasi kotlinOptions lama..."

          python3 - <<'PY'
          from pathlib import Path
          import re

          for p in Path(".").rglob("build.gradle.kts"):
              text = p.read_text()

              fixed = re.sub(
                  r'\n[ \t]*kotlinOptions\s*\{\s*jvmTarget\s*=\s*"17"\s*\}',
                  '',
                  text,
                  flags=re.MULTILINE
              )

              if fixed != text:
                  print("Diperbaiki:", p)
                  p.write_text(fixed)
          PY

          echo "Pengecekan selesai."

      - name: Fix AndroidX Configuration
        working-directory: native-project
        run: |
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build Debug APK
        working-directory: native-project
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KeuanganHarian-debug
          path: native-project/app/build/outputs/apk/debug/app-debug.apk
