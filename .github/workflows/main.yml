name: Build Keuangan Harian Native APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/main.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Find and Extract Native Project
        run: |
          echo "Mencari file ZIP..."

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" ! -name "Keuangan_Harian_PWA.zip" | head -n 1)

          echo "ZIP ditemukan: $ZIP_FILE"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP aplikasi native tidak ditemukan."
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d extracted

          echo "Isi hasil extract:"
          find extracted -maxdepth 2 -type f | head -50

          if [ -d "extracted/KeuanganHarianNative" ]; then
            mv extracted/KeuanganHarianNative native-project
          elif [ -d "extracted/KeuanganHarianNative-Baru" ]; then
            mv extracted/KeuanganHarianNative-Baru native-project
          else
            mv extracted native-project
          fi

          echo "Project native siap."

      - name: Fix AndroidX Configuration
        working-directory: native-project
        run: |
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build Debug APK
        working-directory: native-project
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KeuanganHarian-debug
          path: native-project/app/build/outputs/apk/debug/app-debug.apk
